<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Ustası - İngilizce Kelime Oyunu</title>
  <meta name="description" content="12 farklı oyun moduyla İngilizce kelime bilgini geliştir! 6. sınıf seviyesi.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Animated background orbs -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>

  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="logo"><span>🎓</span><span>Kelime Ustası</span></div>
        <button class="sb-toggle" id="sbToggle">☰</button>
      </div>
      <div class="sb-stats">
        <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-info"><div class="stat-val" id="totalScore">0</div><div class="stat-lbl">Puan</div></div></div>
        <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-info"><div class="stat-val" id="streak">0</div><div class="stat-lbl">Seri</div></div></div>
        <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-info"><div class="stat-val" id="level">1</div><div class="stat-lbl">Seviye</div></div></div>
      </div>
      <div class="sb-label">OYUN MODLARI</div>
      <nav class="sb-nav" id="navInner"></nav>
      <div class="sb-footer">
        <div class="sb-tip">💡 Her gün oyna, İngilizceni geliştir!</div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="content-area">
      <header class="topbar">
        <button class="mob-menu" id="mobMenu">☰</button>
        <div class="topbar-title" id="topTitle">Ana Menü</div>
        <div class="topbar-stats">
          <span class="tb-stat">⭐ <b id="totalScore2">0</b></span>
          <span class="tb-stat">🔥 <b id="streak2">0</b></span>
        </div>
      </header>
      <main class="main"><div id="gameArea"></div></main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="sidebar-overlay" id="sbOverlay"></div>
  <script src="words.js"></script>
  <script src="engine.js"></script>
  <script src="games1.js"></script>
  <script src="games2.js"></script>
</body>
</html>
